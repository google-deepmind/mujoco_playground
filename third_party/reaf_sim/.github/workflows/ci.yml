name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv --python 3.12 .venv

      - name: Sync CPU dependencies
        run: make install-cpu

      - name: Run pre-commit
        run: uv run --no-sync --group dev pre-commit run -a

      - name: Notify team chat
        if: failure() && github.event_name == 'push' && github.ref_name == 'main'
        uses: google-deepmind/mujoco/.github/actions/notify-chat@main
        with:
          service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
          user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
          space-id: "spaces/AAQAvblqAtM"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Sync CPU dependencies
        run: make install-cpu

      - name: Run tests
        run: make test

      - name: Notify team chat
        if: failure() && github.event_name == 'push' && github.ref_name == 'main'
        uses: google-deepmind/mujoco/.github/actions/notify-chat@main
        with:
          service-account-key: ${{ secrets.CHAT_SERVICE_ACCOUNT_KEY }}
          user-id-map: ${{ secrets.CHAT_USER_ID_MAP }}
          space-id: "spaces/AAQAvblqAtM"

  # Aggregates test matrix results into a single version-independent status check.
  ci:
    name: CI
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
