<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #15803d; }
    .device-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0284c7; text-anchor: middle; }
    .device-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #475569; text-anchor: middle; }
  </style>

  <!-- ==================== TOP LEVEL (Environment Interface) ==================== -->
  <!-- Action Input Arrow -->
  <line x1="150" y1="5" x2="150" y2="25" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="115" y="17" class="label">action</text>

  <!-- Action Space Box -->
  <rect x="70" y="25" width="160" height="38" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="49" class="title">Action Space</text>

  <!-- Timestep Output Arrow -->
  <line x1="560" y1="25" x2="560" y2="5" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="595" y="17" class="label">timestep</text>

  <!-- TimeStep Box -->
  <rect x="320" y="25" width="480" height="38" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="49" class="title">dm_env.TimeStep</text>

  <!-- ==================== TASK LAYER CONTAINER ==================== -->
  <rect x="40" y="80" width="780" height="305" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="65" y="106" class="container-title">Task Layer</text>

  <!-- ==================== LEFT COLUMN: ACTION -> COMMANDS ==================== -->
  <!-- Action Space -> ActionSpaceAdapter -->
  <line x1="150" y1="63" x2="150" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- ActionSpaceAdapter -->
  <rect x="70" y="125" width="160" height="44" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="150" y="152" class="title">ActionSpaceAdapter</text>

  <!-- ActionSpaceAdapter -> CommandsProcessor -->
  <line x1="150" y1="169" x2="150" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="105" y="198" class="label">commands</text>

  <!-- CommandsProcessor -->
  <rect x="70" y="220" width="160" height="50" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="150" y="242" class="title">CommandsProcessor</text>
  <text x="150" y="258" class="subtitle">ActionHistory / DeltaActions</text>

  <!-- CommandsProcessor -> Device Layer -->
  <line x1="150" y1="270" x2="150" y2="405" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="95" y="395" class="label">commands (dict)</text>

  <!-- ==================== RIGHT COLUMN: MEASUREMENTS -> FEATURES -> EVALUATION ==================== -->
  <!-- Device Layer -> FeaturesProducer -->
  <line x1="560" y1="405" x2="560" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="635" y="395" class="label">measurements (dict)</text>

  <!-- FeaturesProducer -->
  <rect x="460" y="220" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="242" class="title">FeaturesProducer</text>
  <text x="560" y="258" class="subtitle">Kinematics, poses &amp; sensors</text>

  <!-- FeaturesProducer -> Distribution Bus -->
  <line x1="560" y1="220" x2="560" y2="185" stroke="#334155" stroke-width="2"/>
  <!-- Horizontal Features Bus Line -->
  <line x1="390" y1="185" x2="730" y2="185" stroke="#334155" stroke-width="2"/>
  <text x="560" y="202" class="label">features (dict)</text>

  <!-- 1. Reward -->
  <line x1="390" y1="185" x2="390" y2="169" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <rect x="320" y="125" width="140" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="390" y="152" class="title">Reward</text>
  <!-- Arrow to TimeStep -->
  <line x1="390" y1="125" x2="390" y2="65" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="390" y="95" class="label">reward</text>

  <!-- 2. Observation -->
  <line x1="560" y1="185" x2="560" y2="169" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <rect x="490" y="125" width="140" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="560" y="152" class="title">Observation</text>
  <!-- Arrow to TimeStep -->
  <line x1="560" y1="125" x2="560" y2="65" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="560" y="95" class="label">observation</text>

  <!-- 3. Termination -->
  <line x1="730" y1="185" x2="730" y2="169" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <rect x="660" y="125" width="140" height="44" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="730" y="152" class="title">Termination</text>
  <!-- Arrow to TimeStep -->
  <line x1="730" y1="125" x2="730" y2="65" stroke="#334155" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="730" y="95" class="label">step_type / done</text>

  <!-- ==================== BOTTOM CONTAINER: DEVICE LAYER ==================== -->
  <rect x="40" y="405" width="780" height="48" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="430" y="435" class="device-title">Device Layer</text>
</svg>
