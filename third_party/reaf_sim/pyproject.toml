[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reaf-sim"
version = "0.0.1"
description = "Robotics Environment Authoring Framework - Simulation Modules."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "absl-py",
    "dm-env",
    "dm-tree",
    "gdm_robotics",
    "immutabledict",
    "mujoco[sysid]>=3.4.0",
    "mujoco_warp",
    "numpy",
    "reaf",
    "torch>=2.6.0",
    "warp-lang==1.18.0",
]

[project.optional-dependencies]
cu124 = ["torch>=2.6.0"]
cpu = ["torch>=2.6.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pybind11-stubgen==2.5.5",
    "pyink",
    "pyrefly",
    "isort",
    "pre-commit",
    "pylint",
    "scipy",
    "sphinx>=7.4.7",
]

[project.urls]
Documentation = "https://reaf-sim.readthedocs.io/"
Repository = "https://github.com/google-deepmind/reaf-sim"
Issues = "https://github.com/google-deepmind/reaf-sim/issues"

# `reaf-sim` ships only the `reaf.simulation` subpackage; the `reaf` parent
# package is owned by the `reaf` core distribution.
[tool.setuptools.packages.find]
namespaces = true
include = ["reaf*"]

[tool.pytest.ini_options]
norecursedirs = [
    "third_party",
    ".venv*",
]

[tool.uv]
conflicts = [
  [{extra = "cu124"}, {extra = "cpu"}],
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mujoco_warp = { git = "https://github.com/google-deepmind/mujoco_warp", branch = "deepmind" }
reaf = { git = "https://github.com/google-deepmind/reaf", branch = "main" }
gdm_robotics = { git = "https://github.com/google-deepmind/gdm_robotics", branch = "main" }
mujoco = { index = "mujoco" }
warp-lang = { index = "nvidia" }
torch = [
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
order_by_type = false
known_third_party = ["reaf"]
line_length = 200
skip = ["third_party", ".venv"]
skip_glob = ["**/*.ipynb", "**/.venv*/**"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = ["pylint:", "pyrefly:"]
extend-exclude = '''(
 .ipynb$
 | third_party/
 | \.venv[^/]*/
)'''

[tool.pyrefly]
infer-with-first-use = false
check-unannotated-defs = true
infer-return-types = "never"
project-includes = [
    "reaf",
]
project-excludes = [
    ".venv*/**",
    "docs/**",
]
search-path = [
    ".venv/typings",
    ".",
]
replace-imports-with-any = [
    "mujoco.experimental.*",
    "mujoco.studio",
    "mujoco.studio.*",
    "tracy_client",
    "tracy_client.*",
]
[tool.pyrefly.errors]
implicit-import = false
unused-coroutine = false
protocol-implicitly-defined-attribute = false
redundant-condition = false
unreachable = false
unsafe-overlap = false
redefinition = false
bad-dunder-all = false
bad-override-mutable-attribute = false
bad-override-param-name = false
abstract-method-call = false
