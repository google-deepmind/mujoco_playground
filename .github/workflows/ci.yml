name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install -e ".[test]"
      - name: Trigger git clone
        run: |
          uv run --no-sync python -c "from mujoco_playground._src import mjx_env; mjx_env.ensure_menagerie_exists()"
      - name: Test with pytest
        run: |
          uv run --no-sync pytest -n auto mujoco_playground/_src/
