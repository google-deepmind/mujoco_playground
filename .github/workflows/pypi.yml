# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: pypi

on:
  push:
    tags: "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
      id-token: write # Needed for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "${TAG_NAME}" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes "See the [changelog](https://reaf-sim.readthedocs.io/en/${TAG_NAME}/playground/changelog.html)."

      - name: Build package
        run: |
          uv build

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up failed staging attempt for this exact version (if any)
        run: |
          python3 - <<'PY'
          import email, glob, re, subprocess, tarfile, zipfile
          seen = set()
          for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
            try:
              if f.endswith(".whl"):
                with zipfile.ZipFile(f) as zf:
                  meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                  msg = email.message_from_bytes(zf.read(meta))
              else:
                with tarfile.open(f) as tf:
                  info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                  msg = email.message_from_bytes(tf.extractfile(info).read())
              pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
              ver = msg["Version"].strip()
            except Exception:
              continue
            if (pkg, ver) in seen:
              continue
            seen.add((pkg, ver))
            if subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=mujoco-playground--pypi"
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run([
                  "gcloud", "artifacts", "versions", "delete", ver,
                  f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=mujoco-playground--pypi", "--quiet"
              ], check=False)
          PY

      - name: Publish via OSS Exit Gate
        run: |
          uv tool run twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/mujoco-playground--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/mujoco-playground/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
