[project]
name = "mujoco_playground"
version = "0.2.0"
description = "Playground of robotics real and sim tasks."
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "reaf",
    "reaf-sim",
    "mujoco_warp",
    "gdm_robotics",
    "absl-py",
    "torch>=2.6.0",
    "mujoco[sysid]>=3.4.0",
    "warp-lang==1.18.0",
]

[project.optional-dependencies]
rl = [
    "rsl-rl-lib==5.4.2",
    "tensorboard",
    "tensorboardX",
    "tensordict",
]
cu124 = ["torch>=2.6.0"]
cpu = ["torch>=2.6.0"]

# Real-robot logging and visualization (MCAP and Rerun).
real = [
    "safari-sdk>=2.144.0",  # Episodic MCAP logging for teleop data collection.
    "rerun-sdk",  # Visualizing logged teleop episodes (MCAP) locally.
]

# Hardware identification of serial USB ports and cameras.
identify = [
    "mujoco_playground[real]",
    "pyserial",
    "opencv-python-headless",
]

# Real-robot driver stacks
# One entry per hardware family (servo bus / vendor SDK).
# Robots that share a bus share an entry. Adding a robot only adds an entry here
# if it introduces genuinely new hardware.
feetech = [
    "mujoco_playground[real]",
    "lerobot[feetech]>=0.6.0,<0.7",
]
# I2RT's SDK for its DM-motor arms on a SocketCAN bus (the YAM family).
i2rt = [
    "mujoco_playground[real]",
    "i2rt",
]

# Per-robot aliases
# Resolve a robot name to the driver stack(s) it needs, so users can install by
# the robot they own rather than by the servos inside it. A robot reusing
# existing hardware is a one-line alias.
so101 = [
    "mujoco_playground[identify]",
    "mujoco_playground[feetech]",
]
yam = [
    "mujoco_playground[identify]",
    "mujoco_playground[i2rt]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pybind11-stubgen==2.5.5",
    "pyink",
    "pyrefly",
    "isort",
    "pre-commit",
    "pylint",
    "pynput",
    "sphinx>=7.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mujoco_playground"]

[tool.uv]
conflicts = [
  [{extra = "cu124"}, {extra = "cpu"}],
  # lerobot is a robot-learning framework; we use only its Feetech bus driver,
  # but its metadata pins torch>=2.7 for the training code we never touch, and
  # the cu124 index stops at 2.6.0. Nothing about the hardware needs torch.
  # These never need to coexist: hardware runs on CPU, GPU is for training.
  # Per-robot aliases need their own entry; they pull the driver stack directly.
  [{extra = "cu124"}, {extra = "feetech"}],
  [{extra = "cu124"}, {extra = "so101"}],
]
# safari-sdk declares evdev (Linux /dev/input bindings) for all non-Windows
# platforms but never imports it; it cannot build on macOS. Drop it there.
override-dependencies = ["evdev; sys_platform == 'linux'"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mujoco_warp = { git = "https://github.com/google-deepmind/mujoco_warp", branch = "deepmind" }
reaf-sim = { path = "third_party/reaf_sim", editable = true }
reaf = { git = "https://github.com/google-deepmind/reaf", branch = "main" }
gdm_robotics = { git = "https://github.com/google-deepmind/gdm_robotics", branch = "main" }
# Runs on real hardware and is not on PyPI.
i2rt = { git = "https://github.com/i2rt-robotics/i2rt", tag = "v1.3.6" }
mujoco = { index = "mujoco" }
warp-lang = { index = "nvidia" }
torch = [
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
order_by_type = false
known_third_party = ["mujoco_playground", "profiling", "reaf"]
line_length = 200
skip = ["mujoco_menagerie", "third_party", "mujoco_playground/rss2025", ".venv", ".venv-no-extras"]
skip_glob = ["**/*.ipynb", "**/.venv*/**"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = ["pylint:", "pyrefly:"]
extend-exclude = '''(
 mujoco_menagerie
 | .ipynb$
 | third_party/
 | mujoco_playground/rss2025/
 | \.venv[^/]*/
)'''

[tool.pyrefly]
infer-with-first-use = false
check-unannotated-defs = true
infer-return-types = "never"
project-includes = [
    "mujoco_playground",
    "profiling",
    "third_party/reaf_sim/reaf",
]
project-excludes = [
    "mujoco_playground/rss2025/**",
    ".venv*/**",
    "mujoco_playground/docs/**",
    "third_party/reaf_sim/docs/**",
]
search-path = [
    ".venv/typings",
    ".",
    "third_party/reaf_sim",
]
replace-imports-with-any = [
    "clu",
    "clu.*",
    "cv2",
    "cv2.*",
    "mujoco.experimental.*",
    "mujoco.studio",
    "mujoco.studio.*",
    "tensorflow",
    "tensorflow.*",
    "tracy_client",
    "tracy_client.*",
]

[tool.pyrefly.errors]
implicit-import = false
unused-coroutine = false
protocol-implicitly-defined-attribute = false
redundant-condition = false
unreachable = false
unsafe-overlap = false
redefinition = false
bad-dunder-all = false
bad-override-mutable-attribute = false
bad-override-param-name = false
abstract-method-call = false

[tool.pytest.ini_options]
norecursedirs = [
    "rss2025",
    "third_party",
    ".venv*",
]
